[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "hexagonal-fastapi"
version = "0.1.0"
description = "FastAPI demo showcasing Hexagonal Architecture with Dependency Injection and Pydantic v2."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["fastapi", "hexagonal-architecture", "dependency-injection", "pydantic"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "dependency-injector>=4.41.0",
]

[[project.authors]]
name = "Fabrizio Bonavita"
email = "fabriziobonavita93@gmail.com"

[project.urls]
Repository = "https://github.com/fraps93/hexagonal-fastapi"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
